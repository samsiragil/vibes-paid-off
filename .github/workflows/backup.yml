name: Backup

# Weekly logical backup of the Supabase database (Fase 9) into a private R2 bucket; the newest 8
# are kept. Restore steps: docs/operations.md. Never uploaded as a workflow artifact: the repository
# is public and the dump holds account emails.
#
# Repository secrets:
#   SUPABASE_DB_URL      Session pooler connection string (Supabase → Connect → Session pooler,
#                        port 5432; GitHub runners have no IPv6 for the direct host), password
#                        percent-encoded.
#   R2_ACCOUNT_ID, R2_BACKUP_ACCESS_KEY_ID, R2_BACKUP_SECRET_ACCESS_KEY
#                        An R2 API token with Object Read & Write on the backup bucket only.
# Repository variable:
#   R2_BACKUP_BUCKET     Private bucket without a public domain (not the media bucket).

on:
  schedule:
    # Sunday 19:00 UTC = Monday 02:00 WIB.
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump database
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Set the repository secret SUPABASE_DB_URL."
            exit 1
          fi
          name="vpo-db-$(date -u +%Y-%m-%dT%H%M%SZ)"
          mkdir "$name"
          # Supabase's documented split: roles, schema, then data with triggers off on restore.
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f "$name/roles.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$name/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy \
            -x cron.job_run_details -f "$name/data.sql"
          # An empty or partial dump must fail the run, not replace a good backup.
          grep -q 'CREATE TABLE IF NOT EXISTS "public"."projects"' "$name/schema.sql"
          grep -q 'COPY "public"."projects"' "$name/data.sql"
          tar -czf "$name.tar.gz" "$name"
          ls -l "$name" "$name.tar.gz"
          echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Upload to R2
        run: pnpm backup:r2 upload "${{ steps.dump.outputs.file }}"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
